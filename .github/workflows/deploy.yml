name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 创建 .nojekyll 文件，确保 GitHub Pages 不会使用 Jekyll 处理静态文件
      - name: Create .nojekyll file
        run: touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '.'

      - name: Wait for uploaded artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..24}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
              | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Uploaded Pages artifact $ARTIFACT_ID did not become visible"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Deployment status
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}"

